<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex, nofollow"><title>Deine Angaben · GEO-Pass</title>
<link rel="stylesheet" href="../../../assets/welcome.css"><link rel="stylesheet" href="../../../assets/questionnaire.css">
<link rel="alternate" hreflang="de" href="../../../de/create/identity/"><link rel="alternate" hreflang="en" href="../../../en/create/identity/"><link rel="alternate" hreflang="ru" href="../../../ru/create/identity/"></head>
<body><div class="q-screen">
<header class="q-header"><a class="q-back" href="../">← Zurück</a><nav class="welcome-langs" aria-label="Language / Sprache / Язык"><a lang="de" href="../../de/create/identity/" aria-current="page">DE</a><a lang="en" href="../../en/create/identity/">EN</a><a lang="ru" href="../../ru/create/identity/">RU</a></nav></header>
<main class="q-main">
<div class="q-intro"><h1>Lass uns kennenlernen!</h1><p>Bitte fülle alle Felder aus. Diese Angaben sind für die Erstellung deines GEO-Pass verpflichtend.</p></div>
<form class="q-form" id="octopus-q-form" data-octopus-form data-step="identity" novalidate="false">
<div class="q-fields"><div class="q-field "><label for="fullName">Vor- und Nachname *</label><input id="fullName" name="fullName" type="text" maxlength="160" placeholder="Max Mustermann" autocomplete="name" required></div><div class="q-field "><label for="country">Land *</label><input id="country" name="country" type="text" maxlength="120" placeholder="Deutschland" autocomplete="country-name" required></div><div class="q-field "><label for="locality">Ort *</label><input id="locality" name="locality" type="text" maxlength="120" placeholder="Stadt, Gemeinde oder Dorf" autocomplete="address-level2" required></div><div class="q-field q-field--short"><label for="postalCode">Postleitzahl *</label><input id="postalCode" name="postalCode" type="text" maxlength="120" placeholder="z. B. 10117" autocomplete="postal-code" required></div><div class="q-field "><label for="profession">Beruf / Expertise *</label><input id="profession" name="profession" type="text" maxlength="150" placeholder="z. B. Rechtsanwalt" autocomplete="organization-title" required></div></div>
<button type="submit" class="welcome-mascot q-mascot" aria-label="Weiter"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager" fetchpriority="high"><span class="welcome-mascot__text" aria-hidden="true"><span>Weiter</span></span></button>
</form>
</main></div>

<script src="../../../assets/questionnaire.js" defer></script>
</body></html>
