<header class="q-header"><a class="q-back" href="../medical-role/">← Zurück</a><nav class="welcome-langs" aria-label="Language / Sprache / Язык"><a lang="de" href="../../../de/create/medical-services/" aria-current="page">DE</a><a lang="en" href="../../../en/create/medical-services/">EN</a><a lang="ru" href="../../../ru/create/medical-services/">RU</a></nav></header>
<main class="q-main"><div class="q-intro q-medical-head"><p class="q-beauty-eyebrow">GEO-Pass · Medizinische Ästhetik</p><h1>Für welche Behandlungen möchtest du Anfragen erhalten?</h1><p>Wähle nur die Behandlungsbereiche, die du in deinem Angebot hervorheben möchtest.</p></div>
<form class="q-form q-medical-form" data-octopus-form data-step="medical-services"><fieldset class="q-medical-list" data-required-group data-additional-input="medicalOtherProcedure" data-required-message="Bitte wähle mindestens einen Bereich oder ergänze einen eigenen."><legend>Behandlungsbereiche</legend>
<label class="q-medical-option"><input type="checkbox" name="medicalInjection"><span>Injektionsbehandlungen</span></label>
<label class="q-medical-option"><input type="checkbox" name="medicalDevice"><span>Apparative Kosmetik</span></label>
<label class="q-medical-option"><input type="checkbox" name="medicalLaser"><span>Laserbehandlungen</span></label>
<label class="q-medical-option"><input type="checkbox" name="medicalSkin"><span>Peelings und Hautbehandlungen</span></label>
<label class="q-medical-option"><input type="checkbox" name="medicalMinimallyInvasive"><span>Fadenbehandlungen und weitere minimalinvasive Verfahren</span></label>
<label class="q-medical-option" data-doctor-only><input type="checkbox" name="medicalSurgery"><span>Ästhetische Chirurgie</span></label></fieldset>
<div class="q-medical-other" data-procedure-repeater="medicalOtherProcedure" data-procedure-label="Andere Behandlung" data-procedure-remove="Behandlung entfernen">
<label for="medicalOtherProcedure">Andere Behandlung</label>
<input type="text" id="medicalOtherProcedure" name="medicalOtherProcedure" maxlength="180" placeholder="Eigene Behandlung eintragen …">
<div data-procedure-rows></div>
<button type="button" class="q-procedure-add" data-add-procedure><span class="q-procedure-add__plus" aria-hidden="true">+</span>Weitere Behandlung hinzufügen</button>
</div><p class="q-medical-note">Wähle nur Leistungen aus, die du tatsächlich anbietest.</p>
<button type="submit" disabled class="welcome-mascot q-mascot" aria-label="Weiter"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager" fetchpriority="high"><span class="welcome-mascot__text" aria-hidden="true"><span>Weiter</span></span></button>
</form></main></div>
