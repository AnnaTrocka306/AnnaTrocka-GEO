<div class="q-screen q-screen--geography">
<header class="q-header"><a class="q-back" href="../approach/">← Zurück</a><nav class="welcome-langs" aria-label="Language / Sprache / Язык"><a lang="de" href="../../../de/create/geography/" aria-current="page">DE</a><a lang="en" href="../../../en/create/geography/">EN</a><a lang="ru" href="../../../ru/create/geography/">RU</a></nav></header>
<main class="q-main">
<div class="q-intro q-intro--geography">
<h1>Wo bietest du deine Leistungen an?</h1>
<p>Wähle die Gebiete, in denen du mit Kunden arbeiten möchtest. Mehrfachauswahl ist möglich.</p>
</div>
<form class="q-form q-form--geography" data-octopus-form data-step="geography">
<fieldset class="q-geo-group" data-required-group data-required-message="Bitte wähle mindestens ein Tätigkeitsgebiet."><legend class="q-geo-group__sr">Wo bietest du deine Leistungen an?</legend><div class="q-geo-options"><label class="q-geo-option"><input type="checkbox" name="geoAtWorkplace" value="yes"><span>An der angegebenen Geschäftsadresse</span></label>
<label class="q-geo-option"><input type="checkbox" name="geoLocal" value="yes"><span>In meiner Stadt und Umgebung</span></label>
<label class="q-geo-option"><input type="checkbox" name="geoNational" value="yes"><span>Im ganzen Land</span></label>
<label class="q-geo-option"><input type="checkbox" name="geoSelectedRegions" value="yes"><span>In bestimmten Regionen oder Ländern</span></label>
<label class="q-geo-option"><input type="checkbox" name="geoWorldwide" value="yes"><span>Weltweit</span></label></div></fieldset>
<label class="q-geo-extra"><span>Städte, Regionen oder Länder genauer angeben (optional)</span><input type="text" name="geoAreaDetails" maxlength="240" autocomplete="off"></label>
<fieldset class="q-geo-group q-geo-format" data-required-group data-required-message="Bitte wähle mindestens eine Arbeitsform."><legend>Wie arbeitest du?</legend><div class="q-geo-options"><label class="q-geo-option"><input type="checkbox" name="serviceInPerson" value="yes"><span>Vor Ort / persönlich</span></label>
<label class="q-geo-option"><input type="checkbox" name="serviceRemote" value="yes"><span>Online / aus der Ferne</span></label></div></fieldset>
<button type="submit" disabled class="welcome-mascot q-mascot" aria-label="Weiter"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager" fetchpriority="high"><span class="welcome-mascot__text" aria-hidden="true"><span>Weiter</span></span></button>
</form>
