<div class="q-screen q-screen--sector">

<main class="q-main">
<div class="q-intro"><h1>В какой сфере ты работаешь?</h1><p>Выбери свою основную сферу деятельности. Octopus использует этот выбор, чтобы подготовить вопросы именно для твоей экспертной работы.</p></div>
<form class="q-form" data-octopus-form data-step="sector">
<div class="q-sector-fields">
 <div class="q-sector-field"><label for="sectorId">Сфера деятельности</label>
 <select id="sectorId" name="sectorId">
 <option value="">Выбери сферу из списка</option>
 <option value="beauty">Красота и эстетика</option>
<option value="care">Уход и сопровождение</option>
<option value="legal">Право и юридические услуги</option>
<option value="marketing">Маркетинг и продвижение</option>
<option value="consulting">Бизнес-консалтинг</option>
<option value="health">Медицина и здоровье</option>
<option value="finance">Финансы и налоги</option>
<option value="realestate">Недвижимость</option>
<option value="design">Архитектура и дизайн</option>
<option value="tech">IT и искусственный интеллект</option>
<option value="education">Обучение и экспертные знания</option>
 </select></div>
 <div class="q-sector-field"><label for="sectorOther">Не нашёл свою сферу? Напиши её здесь</label><input id="sectorOther" name="sectorOther" maxlength="160" autocomplete="off" placeholder="Твоя сфера деятельности…"></div>
</div>
<p class="q-sector-note">Сейчас нужна только одна основная сфера. Конкретную специализацию Octopus уточнит на следующих шагах.</p>

</form>
</main>
