<body>
<div class="q-screen q-screen--geography">
<header class="q-header"><a class="q-back" href="../approach/">← Назад</a><nav class="welcome-langs" aria-label="Language / Sprache / Язык"><a lang="de" href="../../../de/create/geography/">DE</a><a lang="en" href="../../../en/create/geography/">EN</a><a lang="ru" href="../../../ru/create/geography/" aria-current="page">RU</a></nav></header>
<main class="q-main">
<div class="q-intro q-intro--geography">
<h1>Где ты оказываешь услуги?</h1>
<p>Выбери территории, в которых ты готов работать с клиентами. Можно отметить несколько вариантов.</p>
</div>
<form class="q-form q-form--geography" data-octopus-form data-step="geography">
<fieldset class="q-geo-group" data-required-group data-required-message="Укажи хотя бы одну территорию."><legend class="q-geo-group__sr">Где ты оказываешь услуги?</legend><div class="q-geo-options"><label class="q-geo-option"><input type="checkbox" name="geoAtWorkplace" value="yes"><span>По указанному рабочему адресу</span></label>
<label class="q-geo-option"><input type="checkbox" name="geoLocal" value="yes"><span>В своём городе и поблизости</span></label>
<label class="q-geo-option"><input type="checkbox" name="geoNational" value="yes"><span>По всей стране</span></label>
<label class="q-geo-option"><input type="checkbox" name="geoSelectedRegions" value="yes"><span>В отдельных регионах или странах</span></label>
<label class="q-geo-option"><input type="checkbox" name="geoWorldwide" value="yes"><span>По всему миру</span></label></div></fieldset>
<label class="q-geo-extra"><span>Уточни города, регионы или страны (если нужно)</span><input type="text" name="geoAreaDetails" maxlength="240" autocomplete="off"></label>
<fieldset class="q-geo-group q-geo-format" data-required-group data-required-message="Выбери хотя бы один формат работы."><legend>Как ты работаешь?</legend><div class="q-geo-options"><label class="q-geo-option"><input type="checkbox" name="serviceInPerson" value="yes"><span>Лично</span></label>
<label class="q-geo-option"><input type="checkbox" name="serviceRemote" value="yes"><span>Онлайн / дистанционно</span></label></div></fieldset>
<button type="submit" disabled class="welcome-mascot q-mascot" aria-label="Дальше"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager" fetchpriority="high"><span class="welcome-mascot__text" aria-hidden="true"><span>Дальше</span></span></button>
</form>
</main></div>
