<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex, nofollow"><title>Рабочий адрес · GEO Pass</title>
<link rel="stylesheet" href="../../../assets/welcome.css"><link rel="stylesheet" href="../../../assets/questionnaire.css">
<link rel="alternate" hreflang="de" href="../../../de/create/workplace/"><link rel="alternate" hreflang="en" href="../../../en/create/workplace/"><link rel="alternate" hreflang="ru" href="../../../ru/create/workplace/"></head>
<body><div class="q-screen q-screen--workplace">
<header class="q-header"><a class="q-back" href="../identity/">← Назад</a><nav class="welcome-langs" aria-label="Language / Sprache / Язык"><a lang="de" href="../../../de/create/workplace/">DE</a><a lang="en" href="../../../en/create/workplace/">EN</a><a lang="ru" href="../../../ru/create/workplace/" aria-current="page">RU</a></nav></header>
<main class="q-main">
<div class="q-intro"><h1>Где ты принимаешь клиентов?</h1><p>Если у тебя есть офис, салон, шоурум или другое место, куда приходят клиенты, укажи рабочий адрес. Если работаешь из дома или по найму, можешь пропустить этот шаг.</p></div>
<form class="q-form" id="octopus-q-form" data-octopus-form data-step="workplace">
<p class="q-workplace-optional">Необязательно: заполняй только при наличии места приёма клиентов.</p>
<div class="q-fields q-fields--address"><div class="q-field "><label for="street">Улица</label><input id="street" name="street" type="text" maxlength="120" placeholder="Например: Friedrichstraße" autocomplete="address-line1" ></div><div class="q-field "><label for="houseNumber">Номер дома</label><input id="houseNumber" name="houseNumber" type="text" maxlength="120" placeholder="Например: 100" autocomplete="off" ></div></div>
<div class="q-fields"><div class="q-field" style="grid-column:span 6"><label for="workplaceType">Тип рабочего места (необязательно)</label><select id="workplaceType" name="workplaceType"><option value="">Выбрать тип</option><option value="office">Офис</option><option value="practice">Кабинет</option><option value="salon">Салон</option><option value="shop">Магазин</option><option value="showroom">Шоурум</option><option value="other">Другое</option></select></div></div>
<div class="q-fields" data-workplace-other hidden><div class="q-field" style="grid-column:span 6"><label for="workplaceTypeOther">Если выбрано «Другое», уточни тип места</label><input id="workplaceTypeOther" type="text" name="workplaceTypeOther" maxlength="100" autocomplete="off"></div></div>
<button type="submit" disabled class="welcome-mascot q-mascot" aria-label="Дальше"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager" fetchpriority="high"><span class="welcome-mascot__text" aria-hidden="true"><span>Дальше</span></span></button>
</form>
</main></div>
<script src="../../../assets/questionnaire.js" defer></script>
</body></html>
