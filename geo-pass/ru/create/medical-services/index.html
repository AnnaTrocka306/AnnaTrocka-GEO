<main class="q-main"><div class="q-intro q-medical-head"><p class="q-beauty-eyebrow">GEO-Pass · Медицинская эстетика</p><h1>Какие процедуры ты хочешь продвигать?</h1><p>Отметь только направления, по которым хочешь получать новые обращения.</p></div>
<form class="q-form q-medical-form" data-octopus-form data-step="medical-services"><fieldset class="q-medical-list" data-required-group data-additional-input="medicalOtherProcedure" data-required-message="Выбери хотя бы один вариант или добавь свой."><legend>Направления процедур</legend>
<label class="q-medical-option"><input type="checkbox" name="medicalInjection"><span>Инъекционные процедуры</span></label>
<label class="q-medical-option"><input type="checkbox" name="medicalDevice"><span>Аппаратная косметология</span></label>
<label class="q-medical-option"><input type="checkbox" name="medicalLaser"><span>Лазерные процедуры</span></label>
<label class="q-medical-option"><input type="checkbox" name="medicalSkin"><span>Пилинги и процедуры для кожи</span></label>
<label class="q-medical-option"><input type="checkbox" name="medicalMinimallyInvasive"><span>Нитевые и другие малоинвазивные процедуры</span></label>
<label class="q-medical-option" data-doctor-only><input type="checkbox" name="medicalSurgery"><span>Эстетическая хирургия</span></label></fieldset>
<div class="q-medical-other" data-procedure-repeater="medicalOtherProcedure" data-procedure-label="Другая процедура" data-procedure-remove="Удалить процедуру">

<input type="text" id="medicalOtherProcedure" name="medicalOtherProcedure" maxlength="180" placeholder="Напиши свою процедуру…">
<div data-procedure-rows></div>
<button type="button" class="q-procedure-add" data-add-procedure><span class="q-procedure-add__plus" aria-hidden="true">+</span>Добавить ещё одну процедуру</button>
</div><p class="q-medical-note">Выбирай только те услуги, которые действительно оказываешь.</p>
