<main class="q-main"><div class="q-intro q-medical-head"><p class="q-beauty-eyebrow">GEO-Pass · Медицинская эстетика</p><h1>Какие подологические услуги ты предлагаешь?</h1><p>Отметь услуги, по которым хочешь получать обращения.</p></div>
<form class="q-form q-medical-form" data-octopus-form data-step="podology-services"><fieldset class="q-medical-list" data-required-group data-additional-input="podOtherProcedure" data-required-message="Выбери хотя бы один вариант или добавь свой."><legend>Подологические услуги</legend>
<label class="q-medical-option"><input type="checkbox" name="podNail"><span>Обработка ногтей</span></label>
<label class="q-medical-option"><input type="checkbox" name="podSkin"><span>Обработка мозолей и огрубевшей кожи</span></label>
<label class="q-medical-option"><input type="checkbox" name="podIngrown"><span>Работа с вросшими ногтями и коррекция ногтей</span></label>
<label class="q-medical-option"><input type="checkbox" name="podRiskFoot"><span>Подологический уход при диабете и других особенностях стоп</span></label>
<label class="q-medical-option"><input type="checkbox" name="podProtection"><span>Разгрузка и защита проблемных участков стопы</span></label>
<label class="q-medical-option"><input type="checkbox" name="podFullCare"><span>Комплексная подологическая обработка</span></label></fieldset>
<div class="q-medical-other" data-procedure-repeater="podOtherProcedure" data-procedure-label="Другая процедура" data-procedure-remove="Удалить процедуру">
<label for="podOtherProcedure">Другая процедура</label>
<input type="text" id="podOtherProcedure" name="podOtherProcedure" maxlength="180" placeholder="Напиши свою процедуру…">
<div data-procedure-rows></div>
<button type="button" class="q-procedure-add" data-add-procedure><span class="q-procedure-add__plus" aria-hidden="true">+</span>Добавить ещё одну процедуру</button>
</div><p class="q-medical-note">Выбирай только те услуги, которые действительно оказываешь.</p>
<button type="submit" disabled class="welcome-mascot q-mascot" aria-label="Дальше"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager" fetchpriority="high"><span class="welcome-mascot__text" aria-hidden="true"><span>Дальше</span></span></button>
