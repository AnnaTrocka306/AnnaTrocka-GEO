<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex, nofollow"><title>Твои данные · GEO Pass</title>
<link rel="stylesheet" href="../../../assets/welcome.css"><link rel="stylesheet" href="../../../assets/questionnaire.css">
<link rel="alternate" hreflang="de" href="../../../de/create/identity/"><link rel="alternate" hreflang="en" href="../../../en/create/identity/"><link rel="alternate" hreflang="ru" href="../../../ru/create/identity/"></head>
<body><div class="q-screen">
<header class="q-header"><a class="q-back" href="../">← Назад</a><nav class="welcome-langs" aria-label="Language / Sprache / Язык"><a lang="de" href="../../../de/create/identity/">DE</a><a lang="en" href="../../../en/create/identity/">EN</a><a lang="ru" href="../../../ru/create/identity/" aria-current="page">RU</a></nav></header>
<main class="q-main">
<div class="q-intro"><h1>Давай познакомимся!</h1><p>Заполни все поля. Эти данные обязательны для создания твоего GEO Pass.</p></div>
<form class="q-form" id="octopus-q-form" data-octopus-form data-step="identity">
<div class="q-fields"><div class="q-field "><label for="fullName">Полное имя и фамилия *</label><input id="fullName" name="fullName" type="text" maxlength="160" placeholder="Например: Анна Иванова" autocomplete="name" required></div><div class="q-field "><label for="country">Страна *</label><input id="country" name="country" type="text" maxlength="120" placeholder="Например: Германия" autocomplete="country-name" required></div><div class="q-field "><label for="locality">Населённый пункт *</label><input id="locality" name="locality" type="text" maxlength="120" placeholder="Город, посёлок или деревня" autocomplete="address-level2" required></div><div class="q-field q-field--short"><label for="postalCode">Почтовый индекс *</label><input id="postalCode" name="postalCode" type="text" maxlength="120" placeholder="Например: 10117" autocomplete="postal-code" required></div><div class="q-field "><label for="profession">Профессия / экспертность *</label><input id="profession" name="profession" type="text" maxlength="150" placeholder="Например: Адвокат" autocomplete="organization-title" required></div></div>
<button type="submit" disabled class="welcome-mascot q-mascot" aria-label="Дальше"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager" fetchpriority="high"><span class="welcome-mascot__text" aria-hidden="true"><span>Дальше</span></span></button>
</form>
</main></div>

<script src="../../../assets/questionnaire.js" defer></script>
</body></html>
