<body><div class="q-screen q-screen--medical-role"><header class="q-header"><a class="q-back" href="../matching/">← Назад</a><nav class="welcome-langs" aria-label="Language / Sprache / Язык"><a lang="de" href="../../../de/create/pflege-role/">DE</a><a lang="ru" href="../../../ru/create/pflege-role/" aria-current="page">RU</a><a lang="en" href="../../../en/create/pflege-role/">EN</a></nav></header>
<main class="q-main"><div class="q-intro q-medical-head"><p class="q-beauty-eyebrow">GEO-Pass · Уход и сопровождение</p><h1>Какая у тебя профессия?</h1><p>Выбери профессию, которая соответствует твоей работе.</p></div>
<form class="q-form q-medical-form" data-pflege-role><fieldset class="q-medical-list"><legend>Профессия</legend><label class="q-medical-option"><input type="radio" name="careRole" value="fach" required><span>Специалист по уходу (Pflegefachperson)</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="alten" required><span>Специалист по уходу за пожилыми (Altenpfleger/in)</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="kranken" required><span>Медицинская сестра / медбрат по уходу (Gesundheits- und Krankenpfleger/in)</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="kinder" required><span>Медицинская сестра / медбрат по уходу за детьми</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="assist" required><span>Ассистент по уходу (Pflegeassistent/in)</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="helfer" required><span>Помощник по уходу (Pflegehelfer/in)</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="betreuung" required><span>Специалист по сопровождению и повседневной помощи</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="haus" required><span>Специалист по помощи по хозяйству</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="heiler" required><span>Специалист по сопровождению людей с инвалидностью</span></label>
<label class="q-medical-option"><input type="radio" name="careRole" value="other" required><span>Другая профессия</span></label></fieldset>
<div class="q-medical-other" data-care-other hidden><label for="careRoleOther">Другая профессия</label><input type="text" id="careRoleOther" name="careRoleOther" maxlength="160" placeholder="Впиши название своей профессии …" autocomplete="off" disabled></div>
<button type="submit" class="welcome-mascot q-mascot" aria-label="Дальше"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager"><span class="welcome-mascot__text" aria-hidden="true"><span>Дальше</span></span></button>
</form></main></div><script src="../../../assets/pflege-role.js?v=20261113pflege1" defer></script></body></html>
