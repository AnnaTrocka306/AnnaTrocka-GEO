<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex, nofollow"><title>Спасибо! Твои контактные данные заполнены. · GEO Pass</title>

<div class="q-screen q-screen--channels">
<header class="q-header"><a class="q-back" href="../terms/">← Назад</a><nav class="welcome-langs" aria-label="Language / Sprache / Язык"><a lang="de" href="../../../de/create/channels/">DE</a><a lang="en" href="../../../en/create/channels/">EN</a><a lang="ru" href="../../../ru/create/channels/" aria-current="page">RU</a></nav></header>
<main class="q-main"><div class="q-intro"><h1>Спасибо! Контактные данные готовы.</h1><p>Выбери, как получать важные сообщения Octopus. Никакой рекламы.</p></div>
<form class="q-form" data-octopus-form data-step="channels">
<div class="q-channels">
<label><input type="checkbox" name="channelEmail" checked>Email</label>
<label><input type="checkbox" name="channelPhone" data-requires-draft="phoneNumber">Телефон</label>
<label><input type="checkbox" name="channelWhatsapp" data-requires-draft="whatsappNumber">WhatsApp</label>
<label><input type="checkbox" name="channelOther">Другой</label></div>
<div class="q-extra-channel" data-conditional="channelOther" data-required="true" hidden><label for="otherChannel">Какой ещё способ связи тебе удобен?</label><input type="text" id="otherChannel" name="otherChannel" maxlength="160" placeholder="Например: Facebook Messenger или Signal"></div>
<p class="q-help">Телефон и WhatsApp можно выбрать, если ты указал соответствующий номер.</p>
<div class="q-continue-alert" role="status" aria-label="Внимание: анкету нужно продолжить."><img class="q-continue-alert__image" src="../../../assets/warning-exclamation.svg" alt="" width="52" height="58"><div><strong>Мы ещё не закончили!</strong><p>Пожалуйста, продолжи заполнять анкету.</p></div></div>
<button type="submit" disabled class="welcome-mascot q-mascot" aria-label="Дальше"><img src="../../../assets/octopus-cta.webp" alt="" width="740" height="357" loading="eager" fetchpriority="high"><span class="welcome-mascot__text" aria-hidden="true"><span>Дальше</span></span></button></form></main></div>
